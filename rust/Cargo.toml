# Holaf-Mix — Rust rewrite workspace.
#
# The Python UI and the Rust daemon evolve together inside the same git repo
# (see docs/rust-rewrite-spec.md).  This workspace will host, in order:
#
#   crates/holaf-core  (J0)  pure model/FX/migration/SPA-formatting — this crate
#   crates/holaf-pw    (J1+) PipeWire layer behind a GraphBackend trait
#   crates/holaf-ipc   (J3+) IPC protocol types
#   crates/holafd      (J3+) daemon binary
#   crates/holafctl    (J3+) CLI
#
# J0/J3 have ZERO PipeWire dependency: everything below compiles and is tested
# without a running PipeWire server.

[workspace]
resolver = "2"
members = [
    "crates/holaf-core",
    "crates/holaf-pw",
    "crates/holaf-ipc",
    "crates/holafd",
    "crates/holafctl",
    "crates/holaf-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV floor enforced by cargo: any toolchain older than this refuses to
# build the workspace. The release workflow installs Arch's `rust` package,
# so this pin MUST stay <= the rustc version that package ships (1.100.0 is the
# current stable, released 2026-11-12; the container used for development has
# 1.99.1). Bumping it above Arch's version breaks CI outright; it also must
# cover the newest dependency floor — `eframe`/`egui_system_font_provider`
# 0.37 require 1.95, `tray-icon`/`muda` 0.26/0.21 require 1.90 — so 1.98 is a
# deliberate low floor with a little headroom below the stable line, not a
# stale value.
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
