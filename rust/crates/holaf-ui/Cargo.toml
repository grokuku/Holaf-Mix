[package]
name = "holaf-ui"
description = "Holaf-Mix Rust/egui user interface (port of the PySide6 interface)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# `cargo run -p holaf-ui` must start the app, not the snapshot tool.
default-run = "holaf-ui"

# Two binaries:
#   * `holaf-ui`           — the real desktop app (eframe + glow).
#   * `holaf-ui-snapshot`  — headless renderer: builds the very same UI tree with
#                            a plain `egui::Context`, rasterises the tessellated
#                            meshes in software and writes a PNG.  It exists so
#                            the layout can be reviewed/verified on a machine
#                            with no display server (this container has none).
[[bin]]
name = "holaf-ui"
path = "src/main.rs"

[[bin]]
name = "holaf-ui-snapshot"
path = "src/bin/holaf-ui-snapshot.rs"

[features]
# The real engine is what makes the UI a mixer, and MIDI is how the user drives
# it (the AKAI MIDI Mix is the primary controller — see `docs/ui-rust-design.md`
# §"MIDI"), so both are ON by default.  The crate still builds without either
# (`--no-default-features` = no `holaf-pw`, no `midir`, mock engine + config-only
# MIDI mappings), which is what the headless snapshot and a machine with no
# libpipewire/libasound need.
default = ["engine-pw", "midi"]
engine-pw = ["dep:holaf-pw"]
# MIDI control (CC/note → volume/mute/mono, learn, LED feedback, port picker,
# reconnection).  Needs an ALSA sequencer at run time (`libasound2-dev` at build
# time) — present on every desktop; where it is missing the UI says so in the
# status bar instead of failing.  The mapping *policy* is always compiled and
# always tested (`src/midi.rs`); only the `midir` device I/O lives behind this
# feature.
midi = ["dep:midir"]
# The real system-tray icon (Show/Hide, Restart, Quit) — Qt's
# `QSystemTrayIcon`.  NOT part of `default` here: `tray-icon` links **GTK3 +
# libappindicator** on Linux, which are not installed on every build machine (the
# dev container started without GTK3 at all), and `cargo test --workspace` must
# stay hermetic.  The SHIPPED build enables it: `scripts/build_rust.sh` adds
# `--features tray` by default (`HOLAF_NO_TRAY=1` opts out), so build.sh, the
# PKGBUILD, the tarball and the CI all produce a UI with the icon.
# The *policy* (menu entries, close rule, menu-id → action mapping) is always
# compiled and tested (`src/tray.rs`); only the GTK/libappindicator I/O lives
# behind this feature.
#
# Arch build deps: `gtk3` (build/link) + `libayatana-appindicator` (the runtime
# appindicator library `libappindicator-sys` dlopen()s; Arch has no
# `libappindicator-gtk3`, that name is AUR-only).  No libxdo: `tray-icon` is used
# with `default-features = false` (see below).  Runtime: an appindicator host
# (`gnome-shell-extension-appindicator`, `kstatusnotifieritem`, `swaybar`'s tray).
tray = ["dep:tray-icon", "dep:gtk"]

[dependencies]
# `default-features = false` everywhere: we do not want the wgpu/x11+wayland
# double stack, nor accesskit/clipboard/persistence.  Only glow/x11/default_fonts.
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "x11",
    "default_fonts",
] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
holaf-core = { path = "../holaf-core" }
holaf-pw = { path = "../holaf-pw", optional = true }
midir = { version = "0.11", optional = true }
# System tray (feature `tray`, enabled by the build script — see above):
# `tray-icon` re-exports `muda`
# for the menu, so only these two are needed.  `gtk` drives the main loop on the
# tray thread (libappindicator needs a running GTK loop).
#
# `default-features = false` on `tray-icon` drops its `libxdo` feature: that
# only powers the predefined Copy/Paste/SelectAll items, which this app never
# uses, and it spares both a build dependency and a runtime `libxdo` dlopen.
tray-icon = { version = "0.19", default-features = false, optional = true }
gtk = { version = "0.18", optional = true }
