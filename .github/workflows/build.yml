# ============================================================================
#  .github/workflows/build.yml — Build Holaf-Mix inside a throwaway Arch
#  container, then upload the result as a downloadable artifact.
# ============================================================================
#  Triggers:
#    - Push to main / any branch (smoke test that it still builds)
#    - Manual trigger from the Actions tab
#    - Tag push matching v* (creates a versioned release-ready artifact)
#
#  Why Arch?
#    Holaf-Mix targets CachyOS / Arch Linux (the user's primary platform).
#    Building on the same distro family as the target means the resulting
#    binary links against the right glibc, libpipewire, libpulse, etc.
#
#  Why a container?
#    - GitHub's `ubuntu-latest` runner doesn't have pacman; we use a
#      privileged container with `archlinux:latest` so we get a real Arch
#      environment, with no risk of polluting the host runner.
#    - The container is destroyed at the end of the job. Nothing persists
#      on GitHub's side except the uploaded artifact.
#
#  Output: two INDEPENDENT artifact sets
#
#    Python build (legacy, still the user-facing app):
#      holaf-mix-{sha}-{arch}
#        holaf-mix-{version}-{arch}.tar.gz  (the distributable bundle)
#        SHA256SUMS
#
#    Rust build (daemon + CLI, J5 — becoming the new core):
#      holaf-rust-{sha}-{arch}
#        holafd, holafctl                    (release binaries, stripped)
#        holaf-rust-{arch}.tar.gz            (both binaries in one tarball)
#
#  Why two separate artifacts (and not one merged bundle)?
#    The Rust workspace is young; the Python app is what users run today.
#    Keeping them in separate upload steps means a broken Rust build never
#    prevents the Python bundle from being published (and vice-versa).
#    When the Rust rewrite is validated, the Python steps can be deleted
#    without touching the Rust ones.
# ============================================================================

name: Build Holaf-Mix

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        type: choice
        default: 'onefile'
        options:
          - onefile
          - onedir
          - both

# Avoid running two builds at once for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Arch Linux
    runs-on: ubuntu-latest
    # Privileged is required for pacman in nested container setups
    container:
      image: archlinux:latest
      options: --privileged --init
    # 45 min: PyInstaller (2 copies of Qt when mode=both) + a cold cargo
    # build of the whole workspace + cargo test no longer fit in 30.
    timeout-minutes: 45

    env:
      # Skip the safety guard inside the CI container (no display, no host)
      HOLAF_BUILD_INSTALL_DEPS: '1'
      DEBIAN_FRONTEND: noninteractive

    steps:
      # ------------------------------------------------------------------
      # 0. Setup
      # ------------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Display environment info
        # Note: this is a best-effort diagnostic. The base archlinux:latest
        # image doesn't ship python3, so we tolerate its absence here —
        # python is installed in the next step.
        run: |
          echo "::group::Environment"
          uname -a
          cat /etc/os-release
          pacman --version | head -1 || echo "(no pacman)"
          command -v python3 >/dev/null && python3 --version || echo "(python3 not yet installed)"
          echo "::endgroup::"

      # ------------------------------------------------------------------
      # 1. Install system dependencies (Arch inside the container)
      # ------------------------------------------------------------------
      - name: Full system upgrade (align glibc with repo packages)
        # Critical: `pacman -Syu` upgrades ALL packages (including glibc)
        # to match the synced repo versions. The base archlinux:latest
        # image may ship an older glibc than the one imagemagick was
        # compiled against, causing:
        #   magick: GLIBC_2.44 not found (required by libMagickCore-7…)
        # A plain `pacman -Sy` (no upgrade) would leave glibc stale while
        # `pacman -S imagemagick` installs the latest build → ABI mismatch.
        run: |
          pacman -Syu --noconfirm

      - name: Install build dependencies
        run: |
          # --noconfirm is safe in CI: no interactive prompts
          #
          # python-rtmidi builds C++ bindings for JACK and ALSA, so we
          # need the dev headers (pkg-config .pc files) for both.
          #
          # sounddevice links against PortAudio at *import* time (not just
          # build time), so we need the shared lib too.
          # base-devel pulls in gcc/g++/make/pkgconf which are also needed.
          #
          # Rust workspace deps (rust/crates/holaf-pw):
          #   pipewire     -> ships libpipewire-0.3.pc AND libspa-0.2.pc
          #                   (there is no separate -dev/-headers package on
          #                   Arch: the headers come with the runtime package)
          #   clang        -> provides libclang.so, required by bindgen
          #                   (libspa-sys / pipewire-sys generate bindings)
          #   rust         -> the Arch package: prebuilt, self-consistent
          #                   toolchain with /usr/bin/cargo and /usr/bin/rustc.
          #                   We install this rather than a version-manager
          #                   shim: in a container job the shim has no default
          #                   toolchain and drops its proxies into a cargo
          #                   home that is neither on PATH nor at a
          #                   predictable location. `rust` needs no
          #                   CARGO_HOME/HOME/PATH juggling at all.
          #                   Requirement: this package must be >= the
          #                   rust-version pin in rust/Cargo.toml (currently
          #                   1.98; Arch ships 1.99.x), otherwise cargo
          #                   refuses the whole workspace.
          # pkgconf is already in the list and is what -sys crates call.
          pacman -S --noconfirm --needed \
            base-devel \
            pkgconf \
            git \
            librsvg \
            imagemagick \
            python \
            python-pip \
            jack2 \
            alsa-lib \
            portaudio \
            pipewire \
            clang \
            rust

          # Arch's `python` package provides /usr/bin/python3; verify
          # before continuing, otherwise the next step fails with a
          # confusing "command not found".
          if ! command -v python3 >/dev/null; then
            echo "::error::python3 not found after installing 'python' package."
            echo "::error::Check that pacman succeeded and PATH includes /usr/bin."
            ls -la /usr/bin/python* 2>/dev/null || true
            exit 1
          fi
          python3 --version

          # Verify the PipeWire / SPA pkg-config files really landed. If this
          # fails, `cargo build -p holaf-pw` will fail later with an opaque
          # "pkg-config exited with status code 1" from the -sys crate, so it
          # is much cheaper to catch it here.
          export PKG_CONFIG_PATH="/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          for pc in libpipewire-0.3 libspa-0.2; do
            if pkg-config --exists "$pc"; then
              echo "  OK   pkg-config: $pc $(pkg-config --modversion "$pc")"
            else
              echo "::error::pkg-config cannot find $pc — Rust build will fail."
              exit 1
            fi
          done

      # ------------------------------------------------------------------
      # 1b. Rust toolchain
      # ------------------------------------------------------------------
      - name: Verify Rust toolchain
        # The toolchain comes from the Arch `rust` package installed above:
        # binaries live in /usr/bin, always on PATH, no CARGO_HOME/HOME
        # assumptions and nothing to persist into $GITHUB_PATH.
        #
        # This step only fails fast when the package is missing. The MSRV is
        # NOT re-checked by hand: cargo enforces rust-version itself with an
        # explicit message ("package ... requires rustc 1.98 or newer"), so a
        # duplicate shell comparison would only add a way to get it wrong.
        run: |
          set -euo pipefail
          command -v cargo || { echo "::error::cargo not found in PATH (pacman 'rust' missing?)"; exit 1; }
          command -v rustc || { echo "::error::rustc not found"; exit 1; }
          cargo --version
          rustc --version

      - name: Install Python build dependencies
        # Use a venv instead of --break-system-packages. On Arch, the
        # system `python3` and the system `pip` (from python-pip) can
        # drift apart in subtle ways; a venv guarantees that imports
        # work in the same interpreter that pip wrote to.
        run: |
          set -e
          python3 -m venv /opt/holaf-venv
          # shellcheck disable=SC1091
          source /opt/holaf-venv/bin/activate

          # Sanity: venv python should be the one we're using
          echo "Using: $(which python3) ($(python3 --version))"
          echo "Site-packages: $(python3 -c 'import site; print(site.getsitepackages())')"

          python3 -m pip install --no-cache-dir --upgrade pip
          python3 -m pip install --no-cache-dir \
            pyinstaller \
            PySide6 \
            sounddevice \
            numpy \
            mido \
            python-rtmidi

          # Verify all packages import in THIS venv. If this passes,
          # build.sh's check_deps will pass too.
          echo "::group::Verifying imports"
          python3 -c "
          import importlib
          for mod in ('PySide6', 'sounddevice', 'numpy', 'mido', 'rtmidi', 'PyInstaller'):
              try:
                  importlib.import_module(mod)
                  print(f'  OK   {mod}')
              except ImportError as e:
                  print(f'  FAIL {mod}: {e}')
                  raise SystemExit(1)
          "
          echo "::endgroup::"

      # ------------------------------------------------------------------
      # 2. Build (using the project's own build.sh, with safety bypass)
      # ------------------------------------------------------------------
      - name: Build (onefile)
        if: ${{ github.event.inputs.mode != 'onedir' && github.event.inputs.mode != 'both' || github.event.inputs.mode == '' }}
        run: |
          # Activate the venv so the same python3 that has the packages
          # is the one build.sh calls.
          # shellcheck disable=SC1091
          source /opt/holaf-venv/bin/activate
          chmod +x build.sh assets/icons/build_icons.sh
          ./build.sh --tarball
        env:
          # Build inside the CI container: bypass the host-install guards.
          HOLAF_BUILD_INSTALL_DEPS: '1'

      - name: Build (onedir, fast launch)
        if: ${{ github.event.inputs.mode == 'onedir' || github.event.inputs.mode == 'both' }}
        run: |
          # Activate the venv too: each `run:` is a fresh shell, so the
          # activation done in the onefile step does NOT carry over. Without
          # this, `pyinstaller` is not found when mode=onedir/both.
          # shellcheck disable=SC1091
          source /opt/holaf-venv/bin/activate
          chmod +x build.sh assets/icons/build_icons.sh
          ./build.sh --onedir --tarball
        env:
          HOLAF_BUILD_INSTALL_DEPS: '1'

      # ------------------------------------------------------------------
      # 3. Rust build (daemon + CLI)
      #    Runs AFTER the Python build (so a Rust breakage can never block the
      #    Python artifact — see the upload steps) and BEFORE the Python smoke
      #    tests, so each toolchain gets its own shell/env. Output lands in
      #    dist/ next to the Python bundle; the "Fold" step below then injects
      #    holafd/holafctl into the already-built Python tarball.
      # ------------------------------------------------------------------
      - name: Diagnose Rust build toolchain (PipeWire / libclang / bindgen)
        # Cheap, best-effort one-stop diagnostic for the *whole* FFI chain, run
        # BEFORE the cargo build so its output sits right next to any failure.
        #
        # Motivation: an Arch-only compile error of the form
        #   no field `data` on type `spa_pod_builder`
        # came from libspa-sys 0.8.0 (bindgen 0.69.5), whose libclang
        # invocation silently degraded some structs to a fake `_address: u8`
        # field with recent libclang versions (upstream pipewire-rs issue
        # #112). Nothing in the old log said which bindgen/libclang pair was
        # in play, so the failure looked like a PipeWire ABI break. One glance
        # at this group answers that question.
        continue-on-error: true
        run: |
          set -uo pipefail
          export PKG_CONFIG_PATH="/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          echo "::group::PipeWire / SPA headers"
          for pc in libpipewire-0.3 libspa-0.2; do
            if pkg-config --exists "$pc"; then
              echo "  $pc = $(pkg-config --modversion "$pc")"
            else
              echo "  $pc = MISSING (pkg-config cannot find it)"
            fi
          done
          echo "::endgroup::"

          echo "::group::Compilers / FFI tooling"
          echo "  cargo    = $(cargo --version 2>/dev/null || echo missing)"
          echo "  rustc    = $(rustc --version 2>/dev/null || echo missing)"
          echo "  clang    = $(clang --version 2>/dev/null | head -1 || echo missing)"
          echo "  libclang = $(ldconfig -p 2>/dev/null | grep -m1 libclang || echo 'not in ldconfig')"
          echo "  LIBCLANG_PATH=${LIBCLANG_PATH:-<unset>}"
          echo "::endgroup::"

          echo "::group::bindgen version resolved for this lockfile"
          # `-i` inverts the tree: who depends on bindgen, and which version won.
          (cd rust && cargo tree -i bindgen --locked 2>/dev/null | head -15) \
            || echo "  (bindgen not in the dependency graph yet — first build?)"
          echo "::endgroup::"

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          # CARGO_HOME is unset in this container, so cargo falls back to
          # its default ($HOME/.cargo): the Arch `rust` package changes
          # nothing here. Only the registry/git caches are worth keeping
          # (rust/target is cached too — it makes the cold build fast on a
          # lockfile-identical rerun, at the cost of a fatter cache entry).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust daemon + CLI (release)
        # PATH: `cargo` is /usr/bin/cargo (Arch `rust` package), so it
        # resolves in this fresh shell with no export and no $GITHUB_PATH
        # entry. Never prepend a custom PATH before this step: it could
        # shadow /usr/bin/cargo with a stale/partial toolchain.
        # LIBCLANG_PATH: Arch puts libclang.so in /usr/lib (no versioned
        # subdir); bindgen's clang-sys search order is not exhaustive, so we
        # point at it explicitly — harmless when unnecessary.
        env:
          LIBCLANG_PATH: /usr/lib
        run: |
          set -euo pipefail
          cd rust
          # --locked is intentional and must NOT be dropped if it fails:
          # a lockfile out of sync with the manifests is a real repository
          # bug (non-reproducible builds). Let the step fail visibly and fix
          # Cargo.lock with `cargo update` locally — do not "repair" it here.
          cargo build --release --locked -p holafd -p holafctl
          cd ..
          mkdir -p dist
          cp rust/target/release/holafd rust/target/release/holafctl dist/
          chmod +x dist/holafd dist/holafctl
          strip dist/holafd dist/holafctl || true
          file dist/holafd dist/holafctl
          ls -lh dist/holafd dist/holafctl

          # Bundle both binaries for users who want a single download.
          arch="$(uname -m)"
          tar -czf "dist/holaf-rust-${arch}.tar.gz" -C dist holafd holafctl
          ls -lh "dist/holaf-rust-${arch}.tar.gz"

          # Runtime linkage sanity: catches a binary linked against
          # libpipewire/libspa versions that are not actually installed.
          # Warning-level on purpose (the Rust core is still experimental and
          # must not block the Python artifact).
          for bin in dist/holafd dist/holafctl; do
            if ldd "$bin" 2>/dev/null | grep -q "not found"; then
              echo "::warning::missing shared libraries for $bin:"
              ldd "$bin" | grep "not found" || true
            else
              echo "  OK   dynamic dependencies resolve for $bin"
            fi
            # The loader running at all proves the ELF is loadable.
            # `timeout` guards against a future change where --help stops
            # being a pure parse-and-exit (e.g. it starts a backend).
            timeout 10 "$bin" --help >/dev/null 2>&1 || true
          done

      - name: Verify generated SPA bindings (bindgen sanity)
        # Regression guard for upstream pipewire-rs issue #112: with an
        # unlucky bindgen/libclang pair, libspa-sys emits a fake
        # `_address: u8` field instead of the real struct fields and the
        # compile later dies on a confusing
        #   no field `data` on type `spa_pod_builder`
        # which reads like a PipeWire ABI break but is purely a binding
        # generation problem. Best effort: never fails the job, but says
        # loudly what the generated bindings look like.
        continue-on-error: true
        run: |
          set -uo pipefail
          shopt -s nullglob

          echo "::group::bindgen version actually used"
          (cd rust && cargo tree -i bindgen --locked 2>/dev/null | head -15) \
            || echo "  (bindgen not in the dependency graph — Rust build skipped?)"
          echo "::endgroup::"

          echo "::group::generated spa_pod_builder"
          found=0
          for f in rust/target/release/build/libspa-sys-*/out/bindings.rs; do
            found=1
            # bindgen may pretty-print the file or emit one long line (no
            # rustfmt in a bare container): flatten both to a single line so
            # a plain grep can extract the struct body.
            flat="$(tr '\n' ' ' < "$f" | sed 's/  */ /g')"
            body="$(printf '%s' "$flat" \
              | grep -o 'pub struct spa_pod_builder {[^}]*}' | head -1)"
            echo "--- $f"
            if [[ -z "$body" ]]; then
              echo "  WARN spa_pod_builder not found in this bindings file"
            elif [[ "$body" == *"pub data"* && "$body" == *"pub size"* ]]; then
              echo "  OK   $body"
            else
              echo "  DEGRADED $body"
              echo "::warning::libspa-sys bindings look degraded (no data/size field): bump the -sys crates or libclang (pipewire-rs issue #112)"
            fi
          done
          if ((found == 0)); then
            echo "::notice::no libspa-sys bindings out dir under rust/target/release/build — Rust build skipped or failed"
          fi
          echo "::endgroup::"

      - name: Fold Rust binaries into the Python bundle
        # build.sh's make_tarball() already copies dist/holafd + dist/holafctl
        # into the bundle *when they exist* — but in this workflow the Python
        # build runs BEFORE the Rust build (deliberately: a Rust failure must
        # not block the Python artifact). So we repack the already-built
        # tarball here, in place. Result: one download contains the Python app
        # AND the Rust daemon/CLI (HOLAF_USE_RUST=1 works out of the box).
        # Tolerant: if no tarball exists (build failed / mode skipped), it
        # does nothing and never fails the job.
        run: |
          set -uo pipefail
          shopt -s nullglob
          tarballs=(dist/holaf-mix-*.tar.gz)
          if ((${#tarballs[@]} == 0)); then
            echo "No Python tarball in dist/ — nothing to fold into."
            exit 0
          fi
          if [[ ! -x dist/holafd || ! -x dist/holafctl ]]; then
            echo "Rust binaries missing — leaving the Python tarball as-is."
            exit 0
          fi
          for tb in "${tarballs[@]}"; do
            workdir=$(mktemp -d)
            tar -xzf "$tb" -C "$workdir"
            # The staging root is holaf-mix-<version>/ (see build.sh)
            root="$(find "$workdir" -mindepth 1 -maxdepth 1 -type d | head -1)"
            if [[ -z "$root" ]]; then
              echo "::warning::$tb has no top-level directory — skipping"
              rm -rf "$workdir"
              continue
            fi
            cp dist/holafd dist/holafctl "$root/"
            chmod +x "$root/holafd" "$root/holafctl"
            tar -czf "$tb" -C "$workdir" "$(basename "$root")"
            rm -rf "$workdir"
            echo "Repacked $tb — Rust entries now inside:"
            tar -tzf "$tb" | grep -E '(holafd|holafctl)$' || echo "  (none!)"
          done

      - name: cargo test (workspace)
        # No PipeWire daemon is required: the live tests in
        # holaf-pw/tests/backend_live.rs self-skip (stderr "SKIP backend_live:
        # no headless PipeWire configured") unless XDG_RUNTIME_DIR points at a
        # headless runtime or HOLAF_PW_LIVE=1 is set. Nothing here sets those,
        # so the job stays hermetic on a stock Arch container.
        env:
          LIBCLANG_PATH: /usr/lib
        run: |
          set -euo pipefail
          cd rust
          cargo test --locked --workspace

      # ------------------------------------------------------------------
      # 4. Verify the Python binary actually runs (smoke test)
      # ------------------------------------------------------------------
      - name: Smoke test — binary well-formed
        run: |
          chmod +x dist/holaf-mix || true
          # Verify it's a valid ELF executable
          file dist/holaf-mix
          ls -lh dist/holaf-mix
          # Strip the binary to shave off ~30% on a real release
          strip dist/holaf-mix 2>/dev/null || true

      - name: Smoke test — bundled modules present in binary
        # Best-effort sanity check. We can't actually RUN the binary
        # (no X11 in CI, no PipeWire, no audio device), so this just
        # verifies the ELF is valid and the bundle size is sensible.
        # Hidden-import issues will surface when the user actually runs
        # the binary on their desktop.
        continue-on-error: true
        run: |
          # 1. The binary is a valid ELF
          file dist/holaf-mix

          # 2. Size sanity check (PyInstaller + PySide6 should be 50-150 MB)
          size_bytes=$(stat -c%s dist/holaf-mix)
          size_mb=$((size_bytes / 1024 / 1024))
          echo "Binary size: ${size_mb} MB"
          if [[ $size_mb -lt 30 ]]; then
            echo "::warning::Binary is suspiciously small (<30 MB). Hidden imports might be missing."
          fi
          if [[ $size_mb -gt 300 ]]; then
            echo "::warning::Binary is suspiciously large (>300 MB). Bundling might be excessive."
          fi

          # 3. Check that the binary embeds Python + PyInstaller markers
          if strings dist/holaf-mix | grep -q "PyInstaller"; then
            echo "  OK   PyInstaller bootloader present"
          else
            echo "  FAIL PyInstaller bootloader not found"
          fi
          if strings dist/holaf-mix | grep -q "PySide6"; then
            echo "  OK   PySide6 strings present in bundle"
          else
            echo "  WARN PySide6 strings not found (may be compressed)"
          fi

      - name: Inspect bundled email modules
        # Diagnose whether the `email` stdlib package and its submodules
        # are actually present in the bundle. This was the root cause of
        # a runtime ModuleNotFoundError on Python 3.12+ — PyInstaller's
        # static analysis misses the lazy-imported submodules.
        # Output is preserved in the workflow log for inspection.
        #
        # PATH FIX: this step used to read $PYI_DIST, which is a *local*
        # variable inside build.sh (PYI_DIST="$BUILD_DIR/dist") and is
        # therefore EMPTY in the workflow env — every branch fell into
        # "no _internal dir" and the diagnostic printed nothing. The real
        # layout, straight from build.sh:
        #   workpath  = build/pyinstaller     (TOC + warn files, per spec)
        #   distpath  = build/dist            (raw PyInstaller output)
        #   published = dist/holaf-mix        (file if onefile, dir if onedir)
        # Note: build.sh wipes the workpath before each mode, so with
        # mode=both only the last mode's TOCs survive — the published
        # on-disk layout check below covers the other mode.
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "::group::Email module introspection"

          PYI_WORK="build/pyinstaller"
          PYI_OUT="build/dist"
          PUBLISHED="dist/holaf-mix"

          toc_files=()
          while IFS= read -r f; do toc_files+=("$f"); done \
            < <(find "$PYI_WORK" -maxdepth 2 -name '*.toc' 2>/dev/null)

          # Real onedir layout, whichever path PyInstaller used
          internal_dir=""
          if [[ -d "$PUBLISHED/_internal" ]]; then
            internal_dir="$PUBLISHED/_internal"
          elif [[ -d "$PYI_OUT/holaf-mix/_internal" ]]; then
            internal_dir="$PYI_OUT/holaf-mix/_internal"
          fi

          echo "TOC files found:    ${#toc_files[@]} under $PYI_WORK"
          echo "_internal dir:      ${internal_dir:-<none — onefile mode>}"

          # 1. Authoritative check: PyInstaller TOCs enumerate every
          #    collected module (Python modules show up as 'email.foo').
          if ((${#toc_files[@]})); then
            echo "--- email* entries in PyInstaller TOCs ---"
            grep -ho "'email[^']*'" "${toc_files[@]}" 2>/dev/null | sort -u | head -40 || true
            n=$(grep -ho "'email[^']*'" "${toc_files[@]}" 2>/dev/null | sort -u | wc -l)
            echo "  -> $n distinct email* entries"
            if [[ "$n" -eq 0 ]]; then
              echo "::warning::No email* module collected — the bundled app will fail to import email."
            elif [[ "$n" -lt 5 ]]; then
              echo "::warning::Only $n email* module(s) collected — submodules are likely missing."
            else
              echo "  OK   $n email* entries collected"
            fi
          else
            echo "::warning::$PYI_WORK/*.toc not found — did a build step run?"
          fi

          # 2. Onedir mode only: the module files are physically on disk
          if [[ -n "$internal_dir" ]]; then
            files_n=$(find "$internal_dir" -path '*email*' 2>/dev/null | wc -l)
            echo "--- email* paths on disk in _internal: $files_n ---"
            find "$internal_dir" -path '*email*' 2>/dev/null | head -20 || true
          fi

          # 3. Sanity: something was actually published to dist/
          if [[ -e "$PUBLISHED" ]]; then
            ls -ld "$PUBLISHED"
          else
            echo "::warning::$PUBLISHED missing — nothing published to dist/."
          fi
          echo "::endgroup::"

      # ------------------------------------------------------------------
      # 5. Compute checksums
      # ------------------------------------------------------------------
      - name: Generate checksums
        # Tolerant loop: the Rust binaries (and their tarball) only exist if
        # the Rust build ran, so a missing file must not fail this step
        # (`sha256sum: holafd: No such file or directory` + exit 1 used to
        # abort the whole job — and with it both artifact uploads — whenever
        # the Rust step was skipped or broken).
        # `!cancelled()` (instead of the implicit success()): we want the
        # checksums even if a later Rust step failed, as long as a tarball
        # was produced.
        if: ${{ !cancelled() && hashFiles('dist/*.tar.gz') != '' }}
        run: |
          set -uo pipefail
          if ! cd dist; then
            echo "::warning::dist/ does not exist — no checksums to generate"
            exit 0
          fi
          # nullglob: the *.tar.gz glob simply disappears when nothing
          # matched. The literal Rust binary names stay in the array on
          # purpose, so the -f test below can report them as missing instead
          # of letting sha256sum abort the step.
          shopt -s nullglob
          files=(*.tar.gz holafd holafctl)
          present=()
          for f in "${files[@]}"; do
            if [[ -f "$f" ]]; then
              present+=("$f")
            else
              echo "::notice::$f is absent (Rust build skipped or failed) — not checksummed"
            fi
          done
          if ((${#present[@]})); then
            sha256sum "${present[@]}" > SHA256SUMS
          else
            echo "::warning::nothing to checksum in dist/ — writing an empty SHA256SUMS"
            : > SHA256SUMS
          fi
          echo "SHA256SUMS (${#present[@]} file(s)):"
          cat SHA256SUMS

      # ------------------------------------------------------------------
      # 6. Upload artifacts — two INDEPENDENT sets
      # ------------------------------------------------------------------
      - name: Upload Python tarball
        # `!cancelled()` + hashFiles guard = the Python artifact is published
        # even when a *later* step (the Rust build, smoke tests, …) failed.
        # That is what makes the two artifact sets truly independent.
        if: ${{ !cancelled() && hashFiles('dist/holaf-mix-*.tar.gz') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: holaf-mix-${{ github.sha }}-${{ runner.arch }}
          # Narrow glob (holaf-mix-*): build.sh names its tarball
          # holaf-mix-<version>-<arch>.tar.gz, so this avoids also grabbing
          # dist/holaf-rust-<arch>.tar.gz, which belongs to the other
          # artifact below.
          path: |
            dist/holaf-mix-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload Rust binaries
        # Kept separate on purpose: if the Rust build breaks, the Python
        # bundle above is still published (and vice-versa: a PyInstaller
        # failure leaves the Rust artifact downloadable if cargo succeeded).
        # Content: holafd + holafctl + a tarball of both + the checksums.
        if: ${{ !cancelled() && hashFiles('dist/holafd') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: holaf-rust-${{ github.sha }}-${{ runner.arch }}
          path: |
            dist/holafd
            dist/holafctl
            dist/holaf-rust-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # ======================================================================
  # Optional: build a .deb / .rpm in a second job (skipped for now, kept
  # as a placeholder for when the user wants Linux distro packages).
  # ======================================================================
