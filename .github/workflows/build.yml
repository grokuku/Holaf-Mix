# ============================================================================
#  .github/workflows/build.yml — Build Holaf-Mix inside a throwaway Arch
#  container, then upload the result as a downloadable artifact.
# ============================================================================
#  Triggers:
#    - Push to main / any branch (smoke test that it still builds)
#    - Manual trigger from the Actions tab
#    - Tag push matching v* (creates a versioned release-ready artifact)
#
#  Why Arch?
#    Holaf-Mix targets CachyOS / Arch Linux (the primary target platform).
#    Building on the same distro family as the target means the resulting
#    binaries link against the right glibc, libpipewire, libpulse, etc.
#
#  How the artifact is consumed — this is the project's delivery path, so
#  nothing is built on the user's machine:
#    push → this workflow runs → download the `holaf-mix-<sha>-<arch>` artifact
#    → install the RUNTIME dependencies (BUILD.md §1.3: pipewire,
#    pipewire-audio, pipewire-pulse, wireplumber, libpulse, alsa-lib,
#    swh-plugins, tap-plugins) → unpack → run ./holaf-ui.
#    `packaging/PKGBUILD` is an optional Arch distribution path (BUILD.md §4),
#    not a prerequisite for the artifact, and it is not exercised here.
#
#  Holaf-Mix is a 100 % Rust product: no Python, no PyInstaller, no venv.
#  The artifact IS the tarball of the three Rust binaries + icons + docs.
#
#  Why a container?
#    - GitHub's `ubuntu-latest` runner doesn't have pacman; we use a
#      privileged container with `archlinux:latest` so we get a real Arch
#      environment, with no risk of polluting the host runner.
#    - The container is destroyed at the end of the job. Nothing persists
#      on GitHub's side except the uploaded artifact.
#
#  Output: ONE artifact
#      holaf-mix-{sha}-{arch}
#        holaf-mix-{version}-{arch}.tar.gz  (holaf-ui + holafd + holafctl +
#                                            icons + .desktop + docs)
#        SHA256SUMS
# ============================================================================

name: Build Holaf-Mix

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Avoid running two builds at once for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Arch Linux
    runs-on: ubuntu-latest
    # Privileged is required for pacman in nested container setups
    container:
      image: archlinux:latest
      options: --privileged --init
    # 40 min: a cold cargo build of the whole workspace + the icon set + the
    # test suite + the packaging steps.
    timeout-minutes: 40

    env:
      # bindgen (libspa-sys / pipewire-sys) needs libclang. Arch puts
      # libclang.so in /usr/lib (no versioned subdir) and clang-sys' search
      # order is not exhaustive, so we point at it explicitly.
      LIBCLANG_PATH: /usr/lib
      # Reproducible build: refuse to update Cargo.lock (see scripts/build_rust.sh)
      HOLAF_CARGO_LOCKED: '1'

    steps:
      # ------------------------------------------------------------------
      # 0. Setup
      # ------------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Display environment info
        run: |
          echo "::group::Environment"
          uname -a
          cat /etc/os-release
          pacman --version | head -1 || echo "(no pacman)"
          echo "::endgroup::"

      # ------------------------------------------------------------------
      # 1. Install build dependencies (Arch inside the container)
      # ------------------------------------------------------------------
      - name: Full system upgrade (align glibc with repo packages)
        # Critical: `pacman -Syu` upgrades ALL packages (including glibc)
        # to match the synced repo versions. The base archlinux:latest
        # image may ship an older glibc than the one imagemagick was
        # compiled against, causing:
        #   magick: GLIBC_2.44 not found (required by libMagickCore-7…)
        # A plain `pacman -Sy` (no upgrade) would leave glibc stale while
        # `pacman -S imagemagick` installs the latest build → ABI mismatch.
        run: |
          pacman -Syu --noconfirm

      - name: Install build dependencies
        run: |
          # --noconfirm is safe in CI: no interactive prompts.
          #
          # Rust workspace deps (rust/crates/holaf-pw):
          #   pipewire     -> ships libpipewire-0.3.pc AND libspa-0.2.pc
          #                   (there is no separate -dev/-headers package on
          #                   Arch: the headers come with the runtime package)
          #   clang        -> provides libclang.so, required by bindgen
          #                   (libspa-sys / pipewire-sys generate bindings)
          #   rust         -> the Arch package: prebuilt, self-consistent
          #                   toolchain with /usr/bin/cargo and /usr/bin/rustc.
          #                   Requirement: this package must be >= the
          #                   rust-version pin in rust/Cargo.toml (currently
          #                   1.98), otherwise cargo refuses the workspace.
          #   pkgconf      -> what the -sys crates call at build time.
          #
          # Runtime helpers the binaries EXEC (`pw-cat` for the VU meters,
          # `pactl` for app list/move) are deliberately NOT installed here:
          # they live in `pipewire-audio` / `libpulse`(+`pipewire-pulse`), and
          # only the *live* tests use them.  Those tests self-skip precisely
          # because this job has no PipeWire daemon.
          pacman -S --noconfirm --needed \
            base-devel \
            pkgconf \
            git \
            librsvg \
            imagemagick \
            alsa-lib \
            pipewire \
            clang \
            rust \
            wayland \
            wayland-protocols \
            libxkbcommon

          # Tray (cargo feature `tray`, ON BY DEFAULT — it is what the packaged
          # app ships) needs **no package at all**: the backend is `ksni`, a
          # pure D-Bus `org.kde.StatusNotifierItem` (see
          # docs/dependency-audit.md).  No gtk3, no libayatana-appindicator, no
          # GMainLoop.  libxdo is not needed either: `tray-icon` is declared
          # with default-features = false.
          #
          # Window backend of holaf-ui: **Wayland** (eframe/winit, feature
          # `wayland`; X11 is opt-in via `--features x11` and never in the
          # packaged build, so a Wayland regression cannot go unnoticed).
          #   wayland            -> libwayland-client + `wayland-scanner`, and
          #                         the protocol XMLs winit generates its
          #                         bindings from.
          #   wayland-protocols  -> xdg-shell/xdg-decoration/viewporter XMLs.
          #   libxkbcommon       -> keyboard handling (`xkbcommon-dl` dlopen()s
          #                         libxkbcommon.so.0 at run time).
          # The three libraries are dlopen()ed, so they show up neither in
          # `ldd` nor in pkg-config output: installing them here is what makes
          # the *build* hermetic, and the Arch packages are what the shipped
          # binary needs at run time.
          for bin in wayland-scanner; do
            command -v "$bin" >/dev/null || {
              echo "::error::$bin not found (pacman: wayland)"; exit 1;
            }
          done
          ls /usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml >/dev/null || {
            echo "::error::wayland-protocols XMLs missing (pacman: wayland-protocols)"; exit 1;
          }

          # Verify the PipeWire / SPA pkg-config files really landed. If this
          # fails, `cargo build -p holaf-pw` will fail later with an opaque
          # "pkg-config exited with status code 1" from the -sys crate, so it
          # is much cheaper to catch it here.
          export PKG_CONFIG_PATH="/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          for pc in libpipewire-0.3 libspa-0.2; do
            if pkg-config --exists "$pc"; then
              echo "  OK   pkg-config: $pc $(pkg-config --modversion "$pc")"
            else
              echo "::error::pkg-config cannot find $pc — Rust build will fail."
              exit 1
            fi
          done

      # ------------------------------------------------------------------
      # 1b. Rust toolchain
      # ------------------------------------------------------------------
      - name: Verify Rust toolchain
        # The toolchain comes from the Arch `rust` package installed above:
        # binaries live in /usr/bin, always on PATH, no CARGO_HOME/HOME
        # assumptions and nothing to persist into $GITHUB_PATH.
        #
        # This step only fails fast when the package is missing. The MSRV is
        # NOT re-checked by hand: cargo enforces rust-version itself with an
        # explicit message ("package ... requires rustc 1.98 or newer").
        run: |
          set -euo pipefail
          command -v cargo || { echo "::error::cargo not found in PATH (pacman 'rust' missing?)"; exit 1; }
          command -v rustc || { echo "::error::rustc not found"; exit 1; }
          cargo --version
          rustc --version

      - name: Diagnose Rust build toolchain (PipeWire / libclang / bindgen)
        # Cheap, best-effort one-stop diagnostic for the *whole* FFI chain, run
        # BEFORE the cargo build so its output sits right next to any failure.
        #
        # Motivation: an Arch-only compile error of the form
        #   no field `data` on type `spa_pod_builder`
        # came from libspa-sys (bindgen), whose libclang invocation silently
        # degraded some structs to a fake `_address: u8` field with recent
        # libclang versions (upstream pipewire-rs issue #112). Nothing in the
        # old log said which bindgen/libclang pair was in play, so the failure
        # looked like a PipeWire ABI break.
        continue-on-error: true
        run: |
          set -uo pipefail
          export PKG_CONFIG_PATH="/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          echo "::group::PipeWire / SPA headers"
          for pc in libpipewire-0.3 libspa-0.2; do
            if pkg-config --exists "$pc"; then
              echo "  $pc = $(pkg-config --modversion "$pc")"
            else
              echo "  $pc = MISSING (pkg-config cannot find it)"
            fi
          done
          echo "::endgroup::"

          echo "::group::Compilers / FFI tooling"
          echo "  cargo    = $(cargo --version 2>/dev/null || echo missing)"
          echo "  rustc    = $(rustc --version 2>/dev/null || echo missing)"
          echo "  clang    = $(clang --version 2>/dev/null | head -1 || echo missing)"
          echo "  libclang = $(ldconfig -p 2>/dev/null | grep -m1 libclang || echo 'not in ldconfig')"
          echo "  LIBCLANG_PATH=${LIBCLANG_PATH:-<unset>}"
          echo "::endgroup::"

          echo "::group::bindgen version resolved for this lockfile"
          (cd rust && cargo tree -i bindgen --locked 2>/dev/null | head -15) \
            || echo "  (bindgen not in the dependency graph yet — first build?)"
          echo "::endgroup::"

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          # CARGO_HOME is unset in this container, so cargo falls back to
          # its default ($HOME/.cargo). Only the registry/git caches are worth
          # keeping (rust/target is cached too — it makes the cold build fast
          # on a lockfile-identical rerun, at the cost of a fatter cache entry).
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ------------------------------------------------------------------
      # 2. Tests (gate) — they need no PipeWire daemon
      # ------------------------------------------------------------------
      - name: cargo test (workspace)
        # The live tests in holaf-pw/tests/*_live.rs self-skip (stderr
        # "SKIP …: no headless PipeWire configured") unless XDG_RUNTIME_DIR
        # points at a headless runtime or HOLAF_PW_LIVE=1 is set. Nothing here
        # sets those, so the job stays hermetic on a stock Arch container.
        #
        # The Rust test suite is the ONLY test suite: the 207 Python tests are
        # gone with the Python layer (docs/python-removal.md).
        run: |
          set -euo pipefail
          cd rust
          cargo test --locked --workspace

      # ------------------------------------------------------------------
      # 3. Build + package (icons + the three release binaries + tarball)
      # ------------------------------------------------------------------
      - name: Build and package (./build.sh --tarball)
        # PATH: `cargo` is /usr/bin/cargo (Arch `rust` package), so it
        # resolves in this fresh shell with no export and no $GITHUB_PATH
        # entry. Never prepend a custom PATH before this step: it could
        # shadow /usr/bin/cargo with a stale/partial toolchain.
        # LIBCLANG_PATH / HOLAF_CARGO_LOCKED come from the job env.
        run: |
          set -euo pipefail
          chmod +x build.sh assets/icons/build_icons.sh scripts/build_rust.sh
          ./build.sh --tarball
          ls -lh dist/

      - name: Build Rust UI with the tray feature (ksni, no GTK)
        # Redundant on purpose with the release build above (which already
        # compiles `--features tray`): this step is the FOCUSED proof that the
        # tray feature alone compiles — the release build could be "fixed" by
        # dropping the feature and still pass.
        #
        # Two guards:
        #   1. `cargo check --features tray` must pass (if the tray stops
        #      compiling we WANT the job red);
        #   2. the tray build must pull **zero GTK/GLib** crates: the whole point
        #      of ksni is that `gtk 0.18` (closed, unmaintained, RUSTSEC-2024-0370
        #      via proc-macro-error) is gone.  A silent re-introduction is exactly
        #      the kind of regression nobody notices.
        run: |
          set -euo pipefail

          cd rust
          cargo check --locked -p holaf-ui --features tray
          echo "  OK   holaf-ui compiles with --features tray (ksni)"

          if cargo tree --locked -p holaf-ui --features tray -e normal \
               | grep -qiE '^[^a-z]*(gtk|gdk|glib|pango|atk|libappindicator) v'; then
            echo "::error::the tray build pulls GTK/GLib again — the backend must stay ksni (no GTK). See docs/dependency-audit.md."
            cargo tree --locked -p holaf-ui --features tray -e normal | grep -iE '(gtk|gdk|glib|pango|atk|libappindicator) v' | head
            exit 1
          fi
          echo "  OK   no GTK/GLib in the tray dependency tree (ksni/D-Bus)"

      - name: Verify the Wayland window backend (and the optional X11 one)
        # `holaf-ui` is a **Wayland** client: eframe is compiled with the
        # `wayland` feature and *without* `x11`.  A stray `x11` in a
        # dependency's defaults would silently bring XWayland back (the binary
        # then shows up as an X11 application).  The checks live in
        # `scripts/check-wayland-guard.sh` so they can be run locally with the
        # exact same rules.
        run: |
          set -euo pipefail
          ./scripts/check-wayland-guard.sh

      - name: Verify generated SPA bindings (bindgen sanity)
        # Regression guard for upstream pipewire-rs issue #112: with an
        # unlucky bindgen/libclang pair, libspa-sys emits a fake
        # `_address: u8` field instead of the real struct fields and the
        # compile later dies on a confusing
        #   no field `data` on type `spa_pod_builder`
        # which reads like a PipeWire ABI break but is purely a binding
        # generation problem. Best effort: never fails the job, but says
        # loudly what the generated bindings look like.
        continue-on-error: true
        run: |
          set -uo pipefail
          shopt -s nullglob

          echo "::group::bindgen version actually used"
          (cd rust && cargo tree -i bindgen --locked 2>/dev/null | head -15) \
            || echo "  (bindgen not in the dependency graph — Rust build skipped?)"
          echo "::endgroup::"

          echo "::group::generated spa_pod_builder"
          found=0
          for f in rust/target/release/build/libspa-sys-*/out/bindings.rs; do
            found=1
            # bindgen may pretty-print the file or emit one long line (no
            # rustfmt in a bare container): flatten both to a single line so
            # a plain grep can extract the struct body.
            flat="$(tr '\n' ' ' < "$f" | sed 's/  */ /g')"
            body="$(printf '%s' "$flat" \
              | grep -o 'pub struct spa_pod_builder {[^}]*}' | head -1)"
            echo "--- $f"
            if [[ -z "$body" ]]; then
              echo "  WARN spa_pod_builder not found in this bindings file"
            elif [[ "$body" == *"pub data"* && "$body" == *"pub size"* ]]; then
              echo "  OK   $body"
            else
              echo "  DEGRADED $body"
              echo "::warning::libspa-sys bindings look degraded (no data/size field): bump the -sys crates or libclang (pipewire-rs issue #112)"
            fi
          done
          if ((found == 0)); then
            echo "::notice::no libspa-sys bindings out dir under rust/target/release/build — Rust build skipped or failed"
          fi
          echo "::endgroup::"

      # ------------------------------------------------------------------
      # 4. Smoke tests on the tarball itself (what the user downloads)
      # ------------------------------------------------------------------
      - name: Smoke test — unpack the tarball, no Python, binaries run
        run: |
          set -euo pipefail

          tarball="$(ls dist/holaf-mix-*.tar.gz | head -1)"
          echo "tarball: $tarball ($(du -h "$tarball" | cut -f1))"

          work="$(mktemp -d)"
          tar -xzf "$tarball" -C "$work"
          root="$(find "$work" -maxdepth 1 -mindepth 1 -type d | head -1)"
          root="$(cd "$root" && pwd)"
          echo "unpacked: $root"
          ls -l "$root"

          # 1. The product contains NO Python at all — this is the whole point
          #    of the Python removal (docs/python-removal.md).
          if tar -tzf "$tarball" | grep -qE '\.py$|\.pyc$|(^|/)__pycache__/'; then
            echo "::error::the tarball still contains Python files:"
            tar -tzf "$tarball" | grep -E '\.py$|\.pyc$|__pycache__' | head
            exit 1
          fi
          echo "  OK   no Python file in the tarball"

          # 2. The four executables the user is told about are there.
          for bin in holaf-ui holafd holafctl holaf-mix; do
            if [[ ! -x "$root/$bin" ]]; then
              echo "::error::$bin missing or not executable in the tarball"
              exit 1
            fi
            echo "  OK   $bin is executable"
          done

          # 3. `--help` is parsed before any window: proves the ELF loads and
          #    its libraries resolve, without a display server.
          out="$(timeout 30 "$root/holaf-ui" --help 2>&1 || true)"
          if ! grep -q "usage: holaf-ui" <<<"$out"; then
            echo "::error::$root/holaf-ui --help failed:"
            echo "$out"
            exit 1
          fi
          echo "  OK   holaf-ui runs (--help)"

          # 4. The `holaf-mix` shell launcher must reach the same binary.
          out="$(timeout 30 "$root/holaf-mix" --help 2>&1 || true)"
          if ! grep -q "usage: holaf-ui" <<<"$out"; then
            echo "::error::holaf-mix did not hand over to holaf-ui:"
            echo "$out"
            exit 1
          fi
          echo "  OK   holaf-mix execs holaf-ui"

          # 5. Runtime linkage sanity: catches a binary linked against
          #    libpipewire/libspa versions that are not installed.
          for bin in holaf-ui holafd holafctl; do
            if ldd "$root/$bin" 2>/dev/null | grep -q "not found"; then
              echo "::error::missing shared libraries for $bin:"
              ldd "$root/$bin" | grep "not found" || true
              exit 1
            fi
            echo "  OK   dynamic dependencies resolve for $bin"
          done

          # 6. Config resolution, headless: with no --config, no $HOLAF_CONFIG,
          #    no config next to the binary and none in the CWD, the binary must
          #    fall back to $XDG_CONFIG_HOME/holaf-mix/config.json (the new
          #    first-run location, see holaf_core::config::default_config_path).
          scratch="$(mktemp -d)"
          out="$(cd "$scratch" && HOME="$scratch/home" timeout 60 "$root/holaf-ui" 2>&1 || true)"
          expected="config: $scratch/home/.config/holaf-mix/config.json"
          if ! grep -qF "$expected" <<<"$out"; then
            echo "::error::config resolution did not fall back to XDG (expected '$expected'):"
            echo "$out" | head -20
            exit 1
          fi
          echo "  OK   config resolves to $expected"
          if ! grep -qE "no display server|cannot open a window" <<<"$out"; then
            echo "::warning::holaf-ui did not report the missing display server:"
            echo "$out" | head -20
          else
            echo "  OK   headless run reports no display server"
          fi

      # ------------------------------------------------------------------
      # 5. Compute checksums
      # ------------------------------------------------------------------
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum holaf-mix-*.tar.gz > SHA256SUMS
          echo "SHA256SUMS:"
          cat SHA256SUMS

      # ------------------------------------------------------------------
      # 6. Upload the artifact (the delivery path)
      # ------------------------------------------------------------------
      - name: Upload Holaf-Mix tarball
        uses: actions/upload-artifact@v4
        with:
          name: holaf-mix-${{ github.sha }}-${{ runner.arch }}
          path: |
            dist/holaf-mix-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
